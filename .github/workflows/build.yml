name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  release:
    types: [published]

permissions:
  contents: write # needed to attach the jar to releases

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test and package
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp clean verify

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: Hanami
          path: target/Hanami-*.jar
          if-no-files-found: error

      - name: Attach jar to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" target/Hanami-*.jar --clobber
