# ──────────────────────────────────────────────────────────────────────
#   花見  Hanami — cosmetics
#
#   Every key under `cosmetics:` is a cosmetic id (a-z, 0-9, _ and -).
#   Admins can add new cosmetics here without writing code; run /hanami reload
#   and any mistake is reported as "cosmetics.yml → <id>.<path>: <problem>".
#
#   A cosmetic is made of one or more LAYERS. Each layer has a particle, a
#   parametric shape, an animation and emission rules. Keys written at the top
#   level are inherited by every entry under `layers:`.
#
#   Shapes:   point, line, polyline, circle, spiral, helix, lissajous, sphere,
#             bezier, glyph (text → particles), mirror, union, transform, radial
#   Particles: simple | dust | dust_transition | color | block | item
#   Curves:   linear, sine, ease_in, ease_out, ease_in_out, pulse, bounce
#   Emit modes: all | sweep (moving heads) | random | progressive (drawn over time)
#
#   The full reference is in the README.
# ──────────────────────────────────────────────────────────────────────

cosmetics:

  # ════════════════════════════════════════════════════════════════════
  #  TRAILS
  # ════════════════════════════════════════════════════════════════════

  sakura_drift:
    type: trail
    name: '<gradient:#ffb7c5:#fbe4ea>Sakura Drift</gradient>'
    lore:
      - '<#9c8a8f>Petals loosen from somewhere'
      - '<#9c8a8f>above and settle where you walk.'
    icon: { material: PINK_PETALS }
    category-order: 10
    unlock: { default: true }
    trail: { min-speed: 0.06, mode: behind }
    layers:
      # real cherry petals, released from shoulder height so they flutter down
      - particle: { kind: simple, particle: CHERRY_LEAVES }
        shape: { kind: sphere, radius: 0.45, points: 32, shell: false }
        offset: [0, 1.4, 0]
        emit: { mode: random, random: { count: 1 }, interval-ticks: 3 }
      # soft blush dust that fades to white
      - particle: { kind: dust_transition, colors: ['#ffb7c5', '#fff5f7'], size: 0.65 }
        shape: { kind: circle, radius: 0.2, points: 8 }
        emit: { mode: random, random: { count: 2 }, spread: [0.06, 0.02, 0.06] }

  sumi_wisps:
    type: trail
    name: '<gradient:#3a3a3a:#a8a8a8>Sumi Wisps</gradient>'
    lore:
      - '<#9c8a8f>Ink lifts off the page'
      - '<#9c8a8f>and curls into the air.'
    icon: { material: INK_SAC }
    category-order: 20
    unlock: { price: 1500 }
    trail: { min-speed: 0.06, mode: behind }
    layers:
      # two curling strands, swept upward like brush smoke
      - particle: { kind: dust_transition, colors: ['#141414', '#9a9a9a'], size: 0.9 }
        shape: { kind: helix, radius: 0.16, height: 0.7, turns: 1.25, strands: 2, points: 24 }
        animation: { rotate: { yaw: 90 } }
        emit:
          mode: sweep
          sweep: { heads: 2, cycles-per-second: 0.9, tail: 2 }
      # the occasional drop of ink drifting up
      - particle: { kind: simple, particle: SQUID_INK }
        shape: { kind: point }
        offset: [0, 0.3, 0]
        emit: { interval-ticks: 6, direction: [0, 1, 0], speed: 0.03 }

  lantern_embers:
    type: trail
    name: '<gradient:#ffcf7a:#e2553b>Lantern Embers</gradient>'
    lore:
      - '<#9c8a8f>Sparks from a paper lantern,'
      - '<#9c8a8f>rising into a summer night.'
    icon: { material: LANTERN }
    category-order: 30
    unlock: { price: 2500 }
    trail: { min-speed: 0.06, mode: behind }
    layers:
      - particle: { kind: simple, particle: SMALL_FLAME }
        shape: { kind: sphere, radius: 0.3, points: 24, shell: false }
        offset: [0, 0.25, 0]
        emit: { mode: random, random: { count: 1 }, interval-ticks: 2, direction: [0, 1, 0], speed: 0.04 }
      # glowing embers cooling from amber to vermilion
      - particle: { kind: dust_transition, colors: ['#ffcf7a', '#c8381e'], size: 0.55 }
        shape: { kind: circle, radius: 0.28, points: 12 }
        offset: [0, 0.1, 0]
        palette: { colors: ['#ffcf7a', '#ff9d4d', '#ffd9a0'], cycle-ticks: 30, curve: sine }
        emit: { mode: random, random: { count: 2 }, spread: [0.04, 0.08, 0.04] }

  koi_ripple:
    type: trail
    name: '<gradient:#ff8f5a:#ffffff:#ff8f5a>Koi Ripple</gradient>'
    lore:
      - '<#9c8a8f>Swim, and the pond answers'
      - '<#9c8a8f>in widening rings.'
      - '<#6b5b60>Only appears in water.'
    icon: { material: TROPICAL_FISH }
    category-order: 40
    unlock: { price: 4000 }
    # each imprint keeps expanding for 26 ticks where it was left
    trail: { min-speed: 0.02, mode: water-surface, linger-ticks: 26, drop-interval-ticks: 8 }
    layers:
      - particle: { kind: dust_transition, colors: ['#f2fbff', '#8fd3e0'], size: 0.55 }
        shape: { kind: circle, radius: 0.45, points: 18, plane: xz }
        animation:
          keyframes:
            - { at: 0.0, scale: 0.25 }
            - { at: 1.0, scale: 2.2, curve: ease_out }
        emit: { interval-ticks: 2 }
      # two koi chasing each other around the first ring
      - particle: { kind: dust, color: '#ff7f50', size: 0.8 }
        shape: { kind: circle, radius: 0.55, points: 24, plane: xz }
        palette: { colors: ['#ff7f50', '#fff4ec'], cycle-ticks: 26, curve: ease_in_out }
        animation:
          keyframes:
            - { at: 0.0, scale: 0.6 }
            - { at: 1.0, scale: 1.4, curve: ease_out }
        emit:
          mode: sweep
          sweep: { heads: 2, cycles-per-second: 0.7, tail: 3 }

  # ════════════════════════════════════════════════════════════════════
  #  AURAS
  # ════════════════════════════════════════════════════════════════════

  hanafubuki:
    type: aura
    name: '<gradient:#ffd1dc:#ffb7c5:#fff5f7>Hanafubuki</gradient>'
    lore:
      - '<#9c8a8f>"Flower blizzard" — petals caught'
      - '<#9c8a8f>in a slow, drifting orbit.'
    icon: { material: CHERRY_SAPLING }
    category-order: 10
    unlock: { default: true }
    aura: { idle-only: true }
    # a flat Lissajous orbit (a=1, b=2) dips and rises twice per loop
    shape: { kind: lissajous, a: 1, b: 2, c: 0, delta: 90, amplitude: [0.95, 0.22, 0.95], points: 120 }
    offset: [0, 1.0, 0]
    layers:
      - particle: { kind: dust_transition, colors: ['#ffb7c5', '#fff8fa'], size: 0.85 }
        emit:
          mode: sweep
          sweep: { heads: 5, cycles-per-second: 0.16, tail: 3 }
      # now and then a real petal slips out of the orbit and falls
      - particle: { kind: simple, particle: CHERRY_LEAVES }
        emit: { mode: random, random: { count: 1 }, interval-ticks: 7 }

  kanji_ring:
    type: aura
    name: '<gradient:#f3d1d9:#d9b56b>Kanji Ring</gradient> <#9c8a8f>花 風 月'
    lore:
      - '<#9c8a8f>Flower, wind and moon turn'
      - '<#9c8a8f>slowly around you.'
      - '<#6b5b60>Needs a CJK font on the server.'
    icon: { material: WRITABLE_BOOK }
    category-order: 20
    unlock: { price: 6000 }
    aura: { idle-only: true }
    layers:
      # text → particles: real font outlines, resampled evenly
      - particle: { kind: dust, color: '#f6dfe5', size: 0.5 }
        palette: { colors: ['#f6dfe5', '#fff8ef', '#e9c97c'], cycle-ticks: 140, curve: sine }
        shape:
          kind: radial
          radius: 1.15
          count: 3
          shapes:
            - kind: glyph
              text: '花'
              font: 'Serif'
              size: 0.62
              points: 56
              fallback: { kind: circle, radius: 0.24, points: 20, plane: xy }
            - kind: glyph
              text: '風'
              font: 'Serif'
              size: 0.62
              points: 56
              fallback: { kind: circle, radius: 0.24, points: 20, plane: xy }
            - kind: glyph
              text: '月'
              font: 'Serif'
              size: 0.62
              points: 56
              fallback: { kind: circle, radius: 0.24, points: 20, plane: xy }
        offset: [0, 1.15, 0]
        animation: { rotate: { yaw: 14 } }
        emit: { interval-ticks: 4, max-points-per-frame: 170 }
      # a thin vermilion ring beneath, with light running around it
      - particle: { kind: dust, color: '#b8485f', size: 0.45 }
        shape: { kind: circle, radius: 1.15, points: 64, plane: xz }
        offset: [0, 0.72, 0]
        animation: { rotate: { yaw: 14 } }
        emit:
          mode: sweep
          sweep: { heads: 3, cycles-per-second: -0.12, tail: 4 }

  hotaru:
    type: aura
    name: '<gradient:#e9ff9c:#a6e36b>Hotaru</gradient>'
    lore:
      - '<#9c8a8f>Fireflies gather at dusk'
      - '<#9c8a8f>and breathe light around you.'
    icon: { material: GLOW_BERRIES }
    category-order: 30
    unlock: { price: 3500 }
    aura: { idle-only: true }
    shape: { kind: sphere, radius: 1.35, points: 96, shell: false }
    offset: [0, 1.1, 0]
    animation:
      bob: { amplitude: 0.18, period-ticks: 90, curve: sine }
    layers:
      # the real FIREFLY particle on 1.21.5+, glowing dust on older versions
      - particle:
          kind: simple
          particle: FIREFLY
          fallback: { kind: dust, color: '#d8ff8a', size: 0.75 }
        emit: { mode: random, random: { count: 2 }, interval-ticks: 4 }
      - particle: { kind: dust, color: '#e9ff9c', size: 0.55 }
        palette: { colors: ['#f4ffc4', '#b8ea6a', '#2f4a1c'], cycle-ticks: 40, curve: pulse }
        emit: { mode: random, random: { count: 4 }, interval-ticks: 2 }

  # ════════════════════════════════════════════════════════════════════
  #  WINGS  — describe the RIGHT wing on the XY plane (+x = outward);
  #           Hanami mirrors it and flaps both sides.
  # ════════════════════════════════════════════════════════════════════

  sakura_wings:
    type: wings
    name: '<gradient:#ffb7c5:#ffffff>Sakura Wings</gradient>'
    lore:
      - '<#9c8a8f>Each wing a single petal,'
      - '<#9c8a8f>notched at the tip.'
    icon: { material: CHERRY_LEAVES }
    category-order: 10
    unlock: { price: 8000 }
    wings: { scale: 1.0, tilt: 14, height: 1.32, back: 0.3 }
    animation:
      flap: { angle: 18, period-ticks: 52, curve: sine }
    layers:
      # the petal outline, with the characteristic sakura notch at the tip
      - particle: { kind: dust_transition, colors: ['#ff9fb4', '#ffffff'], size: 0.7 }
        shape:
          kind: bezier
          points: 72
          segments:
            - [[0.05, 0.15], [0.20, 0.62], [0.55, 0.92], [0.90, 0.82]]
            - [[0.90, 0.82], [0.92, 0.74], [0.87, 0.67], [0.84, 0.62]]
            - [[0.84, 0.62], [0.92, 0.62], [0.99, 0.56], [1.00, 0.48]]
            - [[1.00, 0.48], [0.98, 0.15], [0.70, -0.20], [0.40, -0.30]]
            - [[0.40, -0.30], [0.25, -0.33], [0.12, -0.20], [0.05, -0.05]]
        emit: { interval-ticks: 2 }
      # soft veins fanning from the root
      - particle: { kind: dust, color: '#f9d3dc', size: 0.45 }
        palette: { colors: ['#f9d3dc', '#ffeef2'], cycle-ticks: 60, curve: sine }
        shape:
          kind: bezier
          points: 30
          segments:
            - [[0.08, 0.05], [0.30, 0.35], [0.50, 0.55], [0.74, 0.66]]
            - [[0.08, 0.02], [0.35, 0.15], [0.60, 0.30], [0.86, 0.40]]
            - [[0.08, -0.02], [0.30, -0.08], [0.45, -0.12], [0.62, -0.14]]
        emit: { interval-ticks: 3 }
      - particle: { kind: simple, particle: CHERRY_LEAVES }
        shape: { kind: bezier, points: 20, segments: [[[0.4, -0.3], [0.7, -0.2], [0.98, 0.15], [1.0, 0.48]]] }
        emit: { mode: random, random: { count: 1 }, interval-ticks: 10 }

  tsuru:
    type: wings
    name: '<gradient:#ffffff:#d9d9d9>Tsuru</gradient> <#c8382e>●'
    lore:
      - '<#9c8a8f>The crane: long white wings'
      - '<#9c8a8f>with ink-dipped tips.'
    icon: { material: WHITE_BANNER }
    category-order: 20
    unlock: { price: 9000 }
    wings: { scale: 1.05, tilt: 10, height: 1.34, back: 0.3 }
    animation:
      flap: { angle: 26, period-ticks: 74, curve: ease_in_out }
    layers:
      # white leading edge and scalloped trailing feathers
      - particle: { kind: dust, color: '#fbfbf8', size: 0.75 }
        shape:
          kind: union
          shapes:
            - { kind: bezier, points: 34, segments: [[[0.05, 0.15], [0.40, 0.45], [0.85, 0.55], [1.25, 0.46]]] }
            - kind: polyline
              plane: xy
              points: 36
              vertices: [[0.88, 0.08], [0.75, -0.10], [0.68, 0.04], [0.52, -0.14], [0.45, 0.00], [0.30, -0.16], [0.22, -0.04], [0.05, -0.10]]
        emit: { interval-ticks: 2 }
      # black primary feathers at the tip
      - particle: { kind: dust, color: '#1d1b1c', size: 0.8 }
        shape:
          kind: polyline
          plane: xy
          points: 18
          vertices: [[1.25, 0.46], [1.22, 0.30], [1.12, 0.20], [1.03, 0.12], [0.95, -0.05], [0.88, 0.08]]
        emit: { interval-ticks: 2 }

  kitsunebi:
    type: wings
    name: '<gradient:#a6e9ff:#4b6bff>Kitsunebi</gradient>'
    lore:
      - '<#9c8a8f>Fox-fire: three blue flames'
      - '<#9c8a8f>fanned out like tails.'
    icon: { material: SOUL_LANTERN }
    category-order: 30
    unlock: { price: 12000 }
    wings: { scale: 1.0, tilt: 18, height: 1.3, back: 0.32 }
    animation:
      flap: { angle: 14, period-ticks: 36, curve: sine }
    shape:
      kind: bezier
      points: 66
      segments:
        - [[0.05, 0.10], [0.40, 0.50], [0.70, 0.90], [1.00, 0.95]]
        - [[0.05, 0.00], [0.45, 0.15], [0.80, 0.35], [1.12, 0.40]]
        - [[0.05, -0.10], [0.40, -0.20], [0.70, -0.15], [0.95, -0.05]]
    layers:
      - particle: { kind: dust_transition, colors: ['#bff0ff', '#2f4dff'], size: 0.6 }
        emit: { interval-ticks: 2 }
      # flames licking outward along each tail
      - particle: { kind: simple, particle: SOUL_FIRE_FLAME }
        emit:
          mode: sweep
          sweep: { heads: 3, cycles-per-second: 0.55, tail: 0 }
          interval-ticks: 2
          direction: [0, 1, 0]
          speed: 0.008

  # ════════════════════════════════════════════════════════════════════
  #  PROJECTILE TRAILS  — local +z points along the flight path
  # ════════════════════════════════════════════════════════════════════

  petal_arrow:
    type: projectile
    name: '<gradient:#ffb7c5:#ffffff>Petal Arrow</gradient>'
    lore:
      - '<#9c8a8f>A spiral of blossom'
      - '<#9c8a8f>follows every shot.'
    icon: { material: SPECTRAL_ARROW }
    category-order: 10
    unlock: { default: true }
    projectile: { applies-to: [ARROW, SPECTRAL_ARROW, TRIDENT], max-lifetime-ticks: 100 }
    layers:
      # a ring perpendicular to the path, rolled → a helix wrapped around the flight
      - particle: { kind: dust_transition, colors: ['#ffb7c5', '#ffffff'], size: 0.6 }
        shape: { kind: circle, radius: 0.18, points: 16, plane: xy }
        animation: { rotate: { roll: 900 } }
        emit:
          mode: sweep
          sweep: { heads: 2, cycles-per-second: 0, tail: 0 }
      - particle: { kind: simple, particle: CHERRY_LEAVES }
        shape: { kind: point }
        emit: { interval-ticks: 2 }

  ink_arrow:
    type: projectile
    name: '<gradient:#2a2a2a:#8a8a8a>Fude</gradient> <#9c8a8f>筆'
    lore:
      - '<#9c8a8f>Your arrow becomes a brush,'
      - '<#9c8a8f>its flight a single stroke.'
    icon: { material: BLACK_DYE }
    category-order: 20
    unlock: { price: 3000 }
    projectile: { applies-to: [ALL], max-lifetime-ticks: 100 }
    layers:
      - particle: { kind: dust_transition, colors: ['#0f0f0f', '#7a7a7a'], size: 1.35 }
        shape: { kind: point }
        emit: { count: 2, spread: [0.03, 0.03, 0.03] }
      - particle: { kind: simple, particle: SQUID_INK }
        shape: { kind: point }
        emit: { interval-ticks: 5, direction: [0, -1, 0], speed: 0.02 }

  # ════════════════════════════════════════════════════════════════════
  #  EMOTES & KILL EFFECTS  — one-shot, timed by duration-ticks
  # ════════════════════════════════════════════════════════════════════

  petal_storm:
    type: emote
    name: '<gradient:#ff9fb4:#ffffff:#ff9fb4>Petal Storm</gradient>'
    lore:
      - '<#9c8a8f>A whirlwind of blossom'
      - '<#9c8a8f>spirals into the sky.'
    icon: { material: PINK_TULIP }
    category-order: 10
    unlock: { default: true }
    emote: { duration-ticks: 50, trigger: [kill, command], cooldown-seconds: 15 }
    layers:
      - particle: { kind: dust_transition, colors: ['#ff9fb4', '#ffffff'], size: 0.85 }
        shape: { kind: helix, radius: 1.0, height: 3.2, turns: 2.5, strands: 3, points: 44 }
        animation:
          rotate: { yaw: 160 }
          keyframes:
            - { at: 0.0, scale: 0.25 }
            - { at: 0.45, scale: 1.0, curve: ease_out }
            - { at: 1.0, scale: 1.25, curve: linear }
        emit:
          mode: sweep
          sweep: { heads: 9, cycles-per-second: 0.8, tail: 4 }
      - particle: { kind: simple, particle: CHERRY_LEAVES }
        shape: { kind: sphere, radius: 1.6, points: 48, shell: false }
        offset: [0, 1.6, 0]
        emit: { mode: random, random: { count: 4 } }

  torii:
    type: emote
    name: '<gradient:#e0452b:#b52a1a>Torii</gradient> <#9c8a8f>鳥居'
    lore:
      - '<#9c8a8f>A shrine gate, inked into'
      - '<#9c8a8f>the air one stroke at a time.'
    icon: { material: RED_BANNER }
    category-order: 20
    unlock: { price: 10000 }
    emote: { duration-ticks: 80, trigger: [kill, command], cooldown-seconds: 30 }
    # Stroke order = drawing order: pillars, lower beam, strut, then the curved roof beams.
    shape:
      kind: union
      shapes:
        - { kind: line, from: [-1.10, 0, 0], to: [-1.00, 2.6, 0], points: 22 }
        - { kind: line, from: [1.10, 0, 0], to: [1.00, 2.6, 0], points: 22 }
        - { kind: line, from: [-1.45, 2.22, 0], to: [1.45, 2.22, 0], points: 26 }
        - { kind: line, from: [0, 2.22, 0], to: [0, 2.82, 0], points: 6 }
        - { kind: line, from: [-1.60, 2.84, 0], to: [1.60, 2.84, 0], points: 26 }
        - kind: bezier
          points: 34
          segments: [[[-1.95, 3.12], [-0.9, 2.86], [0.9, 2.86], [1.95, 3.12]]]
    animation: { follow-body-yaw: true }
    layers:
      - particle: { kind: dust, color: '#d9381e', size: 1.05 }
        emit: { mode: progressive, interval-ticks: 2, max-points-per-frame: 140 }
      # gold leaf shimmering on what has been drawn
      - particle: { kind: dust_transition, colors: ['#f2c14e', '#fff6d8'], size: 0.45 }
        emit: { mode: progressive, interval-ticks: 6, spread: [0.12, 0.12, 0.12], max-points-per-frame: 40 }

  ink_splash:
    type: emote
    name: '<gradient:#1a1a1a:#6b6b6b>Ink Splash</gradient> <#9c8a8f>円相'
    lore:
      - '<#9c8a8f>A burst of sumi ink, and an'
      - '<#9c8a8f>ensō circle brushed around it.'
    icon: { material: INK_SAC }
    category-order: 30
    unlock: { price: 5000 }
    emote: { duration-ticks: 40, trigger: [kill, command], cooldown-seconds: 12 }
    layers:
      # the splash: a shell of ink thrown outward, fast then settling
      - particle: { kind: dust_transition, colors: ['#0d0d0d', '#5c5c5c'], size: 1.25 }
        shape: { kind: sphere, radius: 1.0, points: 56, shell: true }
        offset: [0, 1.0, 0]
        animation:
          keyframes:
            - { at: 0.0, scale: 0.1 }
            - { at: 0.35, scale: 1.5, curve: ease_out }
            - { at: 1.0, scale: 1.7, curve: linear }
        emit: { interval-ticks: 3 }
      - particle: { kind: simple, particle: SQUID_INK }
        shape: { kind: point }
        offset: [0, 1.0, 0]
        emit: { interval-ticks: 40, count: 14, spread: [0.5, 0.35, 0.5], speed: 0.06 }
      # the ensō — an unclosed zen circle, brushed on the ground
      - particle: { kind: dust, color: '#141414', size: 1.0 }
        shape: { kind: circle, radius: 1.7, points: 64, plane: xz, arc: 330 }
        offset: [0, 0.08, 0]
        emit: { mode: progressive, interval-ticks: 2 }
